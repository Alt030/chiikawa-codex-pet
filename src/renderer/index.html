<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desktop Pet Agent @ {{version}} by yangbuyiya</title>
    <link rel="icon" type="image/png" href="../assets/logo.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage" aria-live="polite">
      <section id="pet" class="pet" aria-label="Desktop pet">
        <div id="sprite" class="sprite"></div>
        <img id="workingArtwork" class="working-artwork" src="../assets/reactions/shisa-working-fixed.webp" alt="필기하며 작업 중인 시사" hidden />
        <img id="hangoverArtwork" class="working-artwork" src="../assets/reactions/kurimanju-hangover-cutout.png" alt="숙취로 가만히 앉아 있는 쿠리만쥬" hidden />
        <div id="fallback" class="fallback">
          <div class="bot-head">
            <span></span>
            <span></span>
          </div>
          <div class="bot-body"></div>
        </div>
      </section>
      <button id="resizeHandle" class="resize-handle" type="button" aria-label="缩放桌面宠物">
        <img class="resize-icon" src="./resize-handle.svg" alt="" aria-hidden="true" />
      </button>
    </main>
    <script src="./face-tint.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
